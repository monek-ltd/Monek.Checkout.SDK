name: Deploy checkout-js SDK

on:
  workflow_dispatch:

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: 24.x
  SDK_BUCKET: checkout-js.monek.com

jobs:
  Build-SDK:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: SDK/package-lock.json

      - name: Test for vulnerabilities
        working-directory: SDK
        run: npm audit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 #6.1.0
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.PIPELINE_EXECUTION_ROLE }}
          role-session-name: feature-deployment
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Install dependencies
        working-directory: SDK
        run: npm ci

      - name: Build
        working-directory: SDK
        run: npm run build

      - name: Deploy
        run: aws s3 sync ./SDK/dist s3://${{ env.SDK_BUCKET }} --delete
